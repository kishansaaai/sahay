[versions]
agp = "8.5.2"
kotlin = "2.0.21"
composeBom = "2024.10.00"
activityCompose = "1.9.0"
lifecycleRuntimeKtx = "2.8.2"
coroutines = "1.8.1"
room = "2.6.1"
zxing = "3.5.3"
mlkit = "16.0.1"
junit = "4.13.2"
robolectric = "4.14.1"
androidxTest = "1.6.1"
ksp = "2.0.21-1.0.28"
compileSdk = "35"
minSdk = "24"
targetSdk = "35"

[libraries]
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
