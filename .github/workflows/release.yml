name: signed-release-candidate
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare team signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SAHAY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure the team signing secrets in the release environment.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sahay.jks"
      - name: Build signed candidate (model transferred separately)
        env:
          SAHAY_KEYSTORE: ${{ runner.temp }}/sahay.jks
          SAHAY_KEYSTORE_PASSWORD: ${{ secrets.SAHAY_KEYSTORE_PASSWORD }}
          SAHAY_KEY_ALIAS: ${{ secrets.SAHAY_KEY_ALIAS }}
          SAHAY_KEY_PASSWORD: ${{ secrets.SAHAY_KEY_PASSWORD }}
        run: |
          test -n "$SAHAY_KEYSTORE_PASSWORD" && test -n "$SAHAY_KEY_ALIAS" && test -n "$SAHAY_KEY_PASSWORD"
          ./gradlew :app:assembleRelease -Psahay.executorch=true --no-daemon
          python scripts/ci_checks.py --merged-manifest app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          sha256sum app/build/outputs/apk/release/*.apk > app/build/outputs/apk/release/apk-sha256.txt
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/sahay.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: sahay-release-candidate
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/apk-sha256.txt
          if-no-files-found: error
