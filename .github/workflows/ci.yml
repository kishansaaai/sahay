name: ci
on:
  push:
  pull_request:
  # Manual run for a fresh debug APK without pushing a commit (B16).
  workflow_dispatch:
  # Daily integration build so the main-branch APK never goes stale (B16).
  schedule:
    - cron: "30 2 * * *"
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository checks (no INTERNET permission, content JSON valid)
        run: |
          python scripts/ci_checks.py
          python scripts/check_locales.py
      - name: Content validation (acyclic graphs, one correct option, misconception tags)
        run: python scripts/validate_content.py
      - name: Learning engine unit tests
        run: python -m unittest discover -s engine/tests
      - name: LLM layer tests, fixed prompt sets and harness smoke test
        run: |
          python -m unittest discover -s llm/tests -t .
          python eval/prompt_sets.py
          python eval/run_eval.py --generator mock --label ci --n 20 > /dev/null
          python export/build_pte.py --checkpoint-dir /nonexistent --dry-run > /dev/null
          python bench/tests/test_bench.py
      - name: Simulator tests
        run: python -m unittest discover -s simulator/tests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Kotlin engine tests and Python parity
        run: |
          curl -fsSL -o /tmp/kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip || exit 11
          unzip -q /tmp/kc.zip -d /tmp || exit 12
          export PATH=/tmp/kotlinc/bin:$PATH
          kotlinc engine/src/main/kotlin -include-runtime -d /tmp/engine.jar > /tmp/kc.log 2>&1 || { echo "::error::$(java -version 2>&1 | head -2 | tr '\n' ' ') $(grep -v Picked /tmp/kc.log | head -c 900 | tr '\n' ' ')"; exit 13; }
          kotlinc -cp /tmp/engine.jar engine/src/test/kotlin -d /tmp/tests || exit 14
          java -cp /tmp/engine.jar:/tmp/tests com.sahay.engine.EngineTestsKt content || exit 15
          python3 engine/parity_python.py > /tmp/py.txt || exit 16
          java -cp /tmp/engine.jar:/tmp/tests com.sahay.engine.ParityKt content > /tmp/kt.txt || exit 17
          diff /tmp/py.txt /tmp/kt.txt || exit 18
          python3 llm/parity_python.py > /tmp/lpy.txt || exit 19
          java -cp /tmp/engine.jar:/tmp/tests com.sahay.engine.LlmParityKt content > /tmp/lkt.txt || exit 20
          diff /tmp/lpy.txt /tmp/lkt.txt || exit 21

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          S="$(command -v sdkmanager || true)"
          if [ -z "$S" ] && [ -n "$ANDROID_HOME" ]; then S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ -x "$S" ]; then yes | "$S" "platforms;android-35" "build-tools;35.0.0" > /dev/null; fi
      - name: Build debug APK (compiles app/ and engine/)
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Upload large-text accessibility previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sahay-accessibility-previews
          path: app/build/outputs/ui-previews/*.png
          if-no-files-found: warn
      - name: Verify merged APK manifest remains offline
        run: python scripts/ci_checks.py --merged-manifest app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
      - name: Compile the pinned ExecuTorch integration
        run: ./gradlew :app:compileDebugKotlin -Psahay.executorch=true --no-daemon
      - name: Write APK checksum for testers
        run: |
          cd app/build/outputs/apk/debug
          sha256sum ./*.apk | tee apk-sha256.txt
          ls -l ./*.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sahay-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/apk-sha256.txt
          if-no-files-found: error
